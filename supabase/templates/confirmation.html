<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#020617;color:#e2e8f0;font-family:Arial,sans-serif;padding:32px 16px">
    <div style="max-width:520px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px">
      <h1 style="margin:0 0 12px;font-size:24px">Confirme seu e-mail</h1>
      <p style="margin:0 0 24px;color:#94a3b8;line-height:1.5">
        Digite este código no StudoCore para concluir a criação da sua conta:
      </p>
      <div style="font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;background:#020617;border-radius:12px;padding:18px">
        {{ .Token }}
      </div>
      <p style="margin:24px 0 0;color:#64748b;font-size:13px;line-height:1.5">
        Se você não criou esta conta, ignore este e-mail.
      </p>
    </div>
  </body>
</html>
